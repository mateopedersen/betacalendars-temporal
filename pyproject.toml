[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "betacalendars-temporal"
version = "0.1.0"
description = "Deterministic calendar grids, date ranges, recurrence helpers, and calendar boundary utilities for Python applications."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Beta Calendars" }]
requires-python = ">=3.11"
keywords = ["calendar", "datetime", "date", "recurrence", "conda"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Scheduling",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2", "mypy>=1.10", "pytest>=8.0", "ruff>=0.6"]

[project.scripts]
betacal = "betacalendars.cli:main"

[project.urls]
Homepage = "https://www.betacalendars.com/"
Repository = "https://github.com/mateopedersen/betacalendars-temporal"
Documentation = "https://github.com/mateopedersen/betacalendars-temporal#readme"
Issues = "https://github.com/mateopedersen/betacalendars-temporal/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
betacalendars = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
