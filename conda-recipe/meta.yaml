{% set name = "betacalendars-temporal" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/mateopedersen/betacalendars-temporal/releases/download/v{{ version }}/betacalendars_temporal-{{ version }}.tar.gz
  sha256: 786b88b2e58d879e78f871546a2872f286a09c13722b353aec7e686c0c90dbe5

build:
  number: 1
  noarch: python
  script:
    - pip install . --no-deps --no-build-isolation --no-compile -vv
    - python -c "from importlib.metadata import distribution; from pathlib import Path; (Path(distribution('betacalendars-temporal')._path) / 'direct_url.json').unlink(missing_ok=True)"
  entry_points:
    - betacal = betacalendars.cli:main

requirements:
  host:
    - python >=3.11
    - pip
    - setuptools >=68
  run:
    - python >=3.11

test:
  imports:
    - betacalendars
  commands:
    - betacal --help
    - betacal --version
    - betacal month 2027 1 --format json
    - betacal year 2027 --format json
    - betacal boundaries 2027

about:
  home: https://www.betacalendars.com/
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Deterministic calendar grids, recurrence, and date-boundary utilities for Python.
  description: |
    Beta Calendars Temporal Toolkit provides presentation-neutral calendar
    structures built on Python's standard date types. It supports configurable
    week starts, fixed and compact month grids, adjacent-month cells, ISO week
    metadata, bounded recurrence calculations, date-range utilities, and
    deterministic JSON, CSV, and Markdown output. The package is intended for
    application development, reporting, test fixtures, planning systems, and
    other software that needs a reliable calendar model without depending on a
    user-interface framework.
  dev_url: https://github.com/mateopedersen/betacalendars-temporal
  doc_url: https://github.com/mateopedersen/betacalendars-temporal#readme
  doc_source_url: https://github.com/mateopedersen/betacalendars-temporal/blob/main/README.md

extra:
  recipe-maintainers:
    - mateopedersen
